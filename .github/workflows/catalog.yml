name: Refresh catalog
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch catalog
        run: |
          for src in https://gutenberg.pglaf.org/cache/epub/feeds/pg_catalog.csv \
                     https://aleph.pglaf.org/cache/epub/feeds/pg_catalog.csv \
                     https://www.gutenberg.org/cache/epub/feeds/pg_catalog.csv; do
            if curl -fsSL --connect-timeout 20 --max-time 240 --retry 3 --retry-all-errors -C - -o pg_catalog.csv "$src"; then echo "from $src"; break; fi
            rm -f pg_catalog.csv
          done
          test -s pg_catalog.csv
      - name: Build
        run: python build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || (git commit -m "Refresh catalog" && git push)
